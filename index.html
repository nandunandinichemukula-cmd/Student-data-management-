<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>

    <form id="studentForm">
        <input type="hidden" id="studentId">

        <label>Name</label>
        <input id="name" type="text" placeholder="Enter student name" required>

        <label>Age</label>
        <input id="age" type="number" min="1" placeholder="Enter age" required>

        <div>
            <button type="submit" id="saveBtn">Add Student</button>
            <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
        </div>
    </form>

    <p id="message"></p>

    <h2>Students</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
